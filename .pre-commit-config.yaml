# Pre-commit hooks for OFKA.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (fast)
        entry: .venv/Scripts/python.exe -m pytest tests -x -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
